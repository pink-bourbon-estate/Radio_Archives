    <script id="template/popover/popover.html" type="text/ng-template">
      <div class="popover {{placement}}" ng-class="{ in: isOpen(), fade: animation() }">
        <div class="arrow"></div>

        <div class="popover-inner">
            <h3 class="popover-title" ng-bind-html="title | unsafe" ng-show="title"></h3>
            <div class="popover-content" ng-bind-html="content | unsafe"></div>
        </div>
      </div>
    </script>

    <script id="template/accordion/accordion-group.html" type="text/ng-template">
      <div class="panel panel-default">
        <a name="{{heading}}"></a>
        <a name="_{{heading}}"></a>
        <div class="panel-heading">
          <h4 class="panel-title" ng-class="{'is-open': isOpen}">
            <a class="accordion-toggle" href="#_{{heading}}" ng-click="toggleOpen()" accordion-transclude="heading"><span ng-class="{'text-muted': isDisabled}">{{heading}}</span></a>
          </h4>
        </div>
        <div class="panel-collapse" collapse="!isOpen">
          <div class="panel-body" ng-transclude></div>

          <a href="#{{heading}}" ng-click="toggleOpen()" class="visible-xs visible-sm" >
            <div class="panel-footer" >
              Close this section
            </div>
          </a>
        </div>
      </div>
    </script>
