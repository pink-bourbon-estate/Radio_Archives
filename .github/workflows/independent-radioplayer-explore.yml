name: Independent Radioplayer explore

# Run by hand. One-off look, in a headless browser, at how Radioplayer's station search loads its directory.
# See tools/radioplayer_explore.py.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-radioplayer
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Browser
        run: pip install playwright && playwright install --with-deps chromium
      - name: Explore
        run: python3 -u tools/radioplayer_explore.py
      - name: Commit
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent/data/radioplayer
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Independent Archive: Radioplayer explore $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
