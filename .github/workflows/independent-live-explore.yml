name: Independent live feeds explore

# Run by hand. One-off look at what the public now-playing feeds of AzuraCast and radio.co stations return.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-live-explore
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explore
        run: python3 -u tools/live_explore.py
      - name: Commit the result
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent/data/live
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Independent stations: live feeds explore $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
