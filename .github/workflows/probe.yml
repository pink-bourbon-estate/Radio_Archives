name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the playlist address the page declares
        run: |
          UA="RadioArchivesBot/0.1 (+https://github.com/pink-bourbon-estate/Radio_Archives; unofficial non-commercial archive; one-off check)"
          curl -sS -A "$UA" -o page.html https://www.hellorayo.co.uk/jazz-fm/playlist
          python3 - <<'PY'
          import re, json
          h = open("page.html", encoding="utf-8").read()
          d = json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S).group(1))
          s = d["props"]["initialState"]["station"]["data"]
          print("PLAYLIST_URL", s.get("stationPlaylistUrl"))
          print("OTHER_URLS", {k: v for k, v in s.items() if isinstance(v, str) and v.startswith("http") and "playlist" in k.lower() or "api" in k.lower()})
          open("purl.txt", "w").write(s.get("stationPlaylistUrl") or "")
          PY
          echo "--- robots.txt of listenapi.planetradio.co.uk"
          curl -sS -A "$UA" -w "\nstatus %{http_code}\n" https://listenapi.planetradio.co.uk/robots.txt | head -20
          U=$(cat purl.txt)
          if [ -n "$U" ]; then
            sleep 2
            echo "--- one request to the declared playlist address"
            curl -sS -A "$UA" -D - -o body.txt "$U" | head -12
            echo "size: $(wc -c < body.txt)"; head -c 1500 body.txt; echo
          fi
