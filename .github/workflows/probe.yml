name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read how the pickers fetch plays
        run: |
          UA="RadioArchivesBot/0.1 (+https://github.com/pink-bourbon-estate/Radio_Archives; unofficial non-commercial archive; one-off site check)"
          B=https://www.hellorayo.co.uk
          curl -sS -A "$UA" -o app.js "$B/_next/static/chunks/pages/_app-71213e65cbc096d9.js"
          echo "=== api9.2 contexts"
          grep -oE ".{250}api9\.2.{350}" app.js | head -3
          echo "=== recently played / before contexts"
          grep -oE ".{200}(Recently Played|recentlyPlayed|beforeTime|before_time|playlistDate|hourFilter).{300}" app.js | head -4
          echo "=== listenapi path builders"
          grep -oE "[\"'\`]/?(stations_)?(nowplaying|playhistory|playlist|events|tracklist)[A-Za-z_/{}\$-]*[\"'\`]" app.js | sort | uniq -c | sort -rn | head -15
          grep -oE ".{150}(playlist/|tracklist/|playhistory).{250}" app.js | head -4
