name: Independent stations survey

# Run by hand. For every station in independent/stations.tsv that has a website, records whether
# its robots.txt allows us (allowed / blocked / none / unknown) and finds a contact email, then
# commits the result. Nothing is collected here; it makes about 4 requests per station, 2 seconds
# apart, as RadioArchivesBot. The rule that decides what happens next is in
# docs/INDEPENDENT-ARCHIVE.md.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-survey
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Survey the stations
        run: python3 tools/survey.py independent/stations.tsv
      - name: Commit the result
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent/stations.tsv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Independent stations: survey $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
