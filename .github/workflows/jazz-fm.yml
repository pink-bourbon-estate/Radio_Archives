name: Jazz FM collector

# Reads Jazz FM's public playlist page every 15 minutes and adds new plays to the archive.
#
# The page only embeds the latest 5 plays (about 12-25 minutes of music), and the API the site
# uses for older plays disallows automated access in its robots.txt, so it is not used. Plays
# are therefore collected from the day this was switched on, and a delayed or skipped run
# (GitHub does not guarantee schedule timing) can leave a gap. It runs on GitHub's servers, so
# nothing needs to stay switched on at home. The website picks up the data in its daily build.
#
# GitHub's schedule is best-effort, so an external scheduler can also start this workflow on time
# through workflow_dispatch: see docs/SCHEDULER.md. Overlapping runs are harmless.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jazz-fm-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Tests run in the website workflow; here a cached build keeps each run to a few seconds.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: jazzfm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'catalogue/src/**', 'stations/jazz-fm/src/**') }}
          restore-keys: jazzfm-${{ runner.os }}-

      - name: Collect new plays
        run: |
          cargo run --release --locked -p jazzfm -- scrape \
            --data stations/jazz-fm/data --catalogue catalogue/data --dump scrape-debug.html

      # If the page layout changes the step above fails; this keeps the page for fixing the reader.
      - name: Keep the page that failed to read
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scrape-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit new data
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/data stations/jazz-fm/data
          if git diff --cached --quiet; then
            echo "No new plays."
          else
            git commit -m "Jazz FM: add plays $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
