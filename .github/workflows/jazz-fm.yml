name: Jazz FM weekly collector

# Once a week, fetches the latest Jazz FM play history straight from the JSON API behind the
# public playlist page (listenapi.planetradio.co.uk) and appends the plays not yet stored.
#
# One run is about 6 requests a day of history at 48 plays each (roughly 40 small JSON replies,
# about 100 KB in total, 0.25 s apart) and never touches the web page itself. The API keeps about
# a week of history, so a weekly run overlaps the previous one and leaves no gaps; a missed run
# can be fixed by running this workflow by hand within the following days. Full explanation,
# including the robots.txt decision: docs/JAZZ-FM.md. The website picks the data up in its daily build.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jazz-fm-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Tests run in the website workflow; the cache keeps the build short.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: jazzfm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'catalogue/src/**', 'stations/jazz-fm/src/**') }}
          restore-keys: jazzfm-${{ runner.os }}-

      - name: Collect new plays
        run: |
          cargo run --release --locked -p jazzfm -- collect \
            --data stations/jazz-fm/data --catalogue catalogue/data

      - name: Commit new data
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/data stations/jazz-fm/data
          if git diff --cached --quiet; then
            echo "No new plays."
          else
            git commit -m "Jazz FM: add plays $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
