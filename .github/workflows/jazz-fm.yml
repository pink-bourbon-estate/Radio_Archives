name: Jazz FM daily collector

# Once a day, fetches the latest Jazz FM play history straight from the JSON API behind the
# public playlist page (listenapi.planetradio.co.uk) and appends the plays not yet stored.
#
# One run asks for the last day of plays: about 6 requests at 48 plays each (about 17 KB in all,
# 0.25 s apart), and never touches the web page itself. The API keeps about a week of history, so
# a missed run is filled in by the next one (about six runs of slack). Full explanation,
# including the robots.txt decision: docs/JAZZ-FM.md. The website's daily build (06:17 UTC) runs
# an hour later and picks the data up.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jazz-fm-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Tests run in the website workflow; the cache keeps the build short.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: jazzfm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'catalogue/src/**', 'stations/jazz-fm/src/**') }}
          restore-keys: jazzfm-${{ runner.os }}-

      # Collects, commits and pushes. If another run pushed first (for example two manual runs
      # started together), start again from the latest main: collecting is incremental, so
      # repeating it is safe and always ends with a clean push.
      - name: Collect new plays and commit them
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo build --release --locked -p jazzfm
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            ./target/release/jazzfm collect \
              --data stations/jazz-fm/data --catalogue catalogue/data
            git add catalogue/data stations/jazz-fm/data
            if git diff --cached --quiet; then
              echo "No new plays."
              exit 0
            fi
            git commit -m "Jazz FM: add plays $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); starting again from the latest main."
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
