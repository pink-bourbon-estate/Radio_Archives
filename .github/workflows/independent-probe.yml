name: Independent stations probe

# Run by hand. For each station whose robots.txt allows us, looks at the home page and a few usual paths
# (2 seconds apart, as RadioArchivesBot) to see how it publishes tracks and programmes, and commits
# independent/probe.tsv. Nothing is collected. See tools/probe.py.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the stations
        run: python3 -u tools/probe.py
      - name: Commit the result
        run: |
          git config user.name "radio-archives-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add independent/probe.tsv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Independent stations: probe $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
